{% extends "core/base.html" %}

{% block content %}
<h1>Messages</h1>

<style>
    .user-list {
        list-style: none;
        padding: 0;
        max-width: 500px;
    }
    .user-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        margin-bottom: 6px;
        background: #f5f5f5;
        border-radius: 6px;
    }
    .user-list li:hover {
        background: #e8e8e8;
    }
    .user-list .username {
        font-weight: 600;
    }
    .user-list .badge {
        background: #d9534f;
        color: #fff;
        border-radius: 12px;
        padding: 2px 8px;
        font-size: 0.8em;
        margin-left: 8px;
    }
    .user-list a.msg-btn {
        text-decoration: none;
        background: #337ab7;
        color: #fff;
        padding: 5px 14px;
        border-radius: 4px;
        font-size: 0.9em;
    }
    .user-list a.msg-btn:hover {
        background: #286090;
    }
</style>

{% if user_list %}
<ul class="user-list">
    {% for entry in user_list %}
    <li>
        <span class="username">
            {{ entry.user.username }}
            {% if entry.unread %}
                <span class="badge">{{ entry.unread }}</span>
            {% endif %}
        </span>
        <a class="msg-btn" href="{% url 'messaging:conversation' entry.user.pk %}">Message</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No other users to message yet.</p>
{% endif %}

{% endblock %}
